<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Family Veda">
  <title>Family Veda</title>
  <defs>
    <linearGradient id="fv-heart" x1="4" y1="54" x2="53" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BC53F"/>
      <stop offset="0.42" stop-color="#1FA07E"/>
