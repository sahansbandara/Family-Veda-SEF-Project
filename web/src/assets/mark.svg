        d="M47 6.2 59.9 10v8.7c0 6.9-4.5 12.9-11.9 15.1-7.4-2.2-11.9-8.2-11.9-15.1V10L47 6.2Z"/>

  <!-- medical cross -->
  <path fill="#FFFFFF" d="M45.3 11.6h3.5v4.4h4.4v3.5h-4.4v4.4h-3.5v-4.4h-4.4V16h4.4Z"/>
