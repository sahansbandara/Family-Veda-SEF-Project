<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <script>
      (function() {
        var theme = localStorage.getItem('fv-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Family Veda — Clinical workspace</title>
    <meta name="description" content="Clinical decision-support workspace. Every AI draft is reviewed by a licensed doctor before a patient sees it." />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#EDF3F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07100F" media="(prefers-color-scheme: dark)" />

    <!-- Internal clinical tool: never index, never preview. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
